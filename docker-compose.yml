services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: theorm
      POSTGRES_PASSWORD: theorm
      POSTGRES_DB: theorm
    ports: ["5432:5432"]
    # ponytail: migrations run once on an empty volume via initdb. Swap for a
    # real migration tool (goose/atlas) when 0002 exists.
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - theorm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theorm"]
      interval: 5s

volumes:
  theorm-db:
